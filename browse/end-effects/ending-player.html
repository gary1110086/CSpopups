<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round ending</title><link rel="stylesheet" href="effect.css?v=ending3"><style>
body{background:#10120e}#stage,.controls,.sample{display:none!important}#result h2{font-size:clamp(60px,9vw,125px)}#sound-controls{position:fixed;bottom:24px;left:28px;z-index:60;display:flex;gap:15px;align-items:center;font-size:12px;color:#ccd3bd}#sound-controls button{padding:9px 15px;font-size:12px}
