<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>一分钟挑战 · One Minute</title>
</head>
<body>
  <p>旧版已停用，请前往当前体验。<br>This prototype has retired. Continue to the current experience.</p>
  <p><a id="continue" href="browse/destination.html?site=corn&amp;v=audio1&amp;lang=zh">继续 · Continue</a></p>
  <script>
    (() => {
      const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
      const target = new URL("browse/destination.html?site=corn&v=audio1", location.href);
      target.searchParams.set('lang', lang);
      document.getElementById('continue').href = target.href;
      location.replace(target.href);
    })();
  </script>
</body>
</html>
