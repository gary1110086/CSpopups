<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="一分钟完成网站小任务，同时应对不断出现的广告。A one-minute browsing challenge with distracting ads.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>一分钟挑战 · One Minute</title>
</head>
<body>
  <p>正在打开一分钟挑战。<br>Opening One Minute.</p>
  <p><a id="continue" href="browse/booth.html?v=audio1&amp;lang=zh">继续 · Continue</a></p>
  <script>
    (() => {
      const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
      const target = new URL("browse/booth.html?v=audio1", location.href);
      target.searchParams.set('lang', lang);
      document.getElementById('continue').href = target.href;
      location.replace(target.href);
    })();
  </script>
</body>
</html>
